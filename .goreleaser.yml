version: 2

builds:
  - id: default
    binary: runpodctl
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    flags: [-mod=mod]
    ldflags:
      - -s -w -X main.Version={{ .Version }}-{{ .ShortCommit }}

  # standalone per-arch binaries so older runpodctl versions can self-update
  # (the old update command expects raw binaries named runpodctl-{os}-{arch})
  - id: legacy
    binary: runpodctl
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    flags: [-mod=mod]
    ldflags:
      - -s -w -X main.Version={{ .Version }}-{{ .ShortCommit }}

  - id: linux_amd64_upx
    binary: runpodctl
    goos: [linux]
    goarch: [amd64]
    env: [CGO_ENABLED=0]
    flags: [-mod=mod]
    ldflags:
      - -s -w -X main.Version={{ .Version }}-{{ .ShortCommit }}

upx:
  - enabled: true
    ids: [linux_amd64_upx]
    goos: [linux]
    goarch: [amd64]
    lzma: false
    compress: best

universal_binaries:
  - id: default
    replace: true
    # sign + notarize after the per-arch builds are merged into the fat binary;
    # signing before the merge produces an invalid signature. snapshots ad-hoc
    # sign and skip the notary submission so local builds need no credentials.
    hooks:
      post:
        # output: true streams quill's progress live. it is not what surfaces a
        # rejection: goreleaser buffers hook output and attaches it to the error
        # anyway, and quill already puts apple's rejection log in the error it
        # returns. quill logs the submission id at trace only, so to query a past
        # submission by hand use `quill submission list` rather than raising the
        # log level here (trace logging on a job holding the signing identity is
        # not worth the id).
        - cmd: quill sign-and-notarize "{{ .Path }}" --dry-run={{ .IsSnapshot }} --ad-hoc={{ .IsSnapshot }}
          output: true

archives:
  - id: default
    ids: [default]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"

  # raw binaries for backward compat with old runpodctl update command
  - id: legacy
    ids: [legacy]
    formats: [binary]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"

  # UPX linux/amd64 artifact, also archived for internal Runpod use
  - id: upx
    ids: [linux_amd64_upx]
    formats: [tar.gz]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}-upx"

release:
  prerelease: auto

brews:
  - name: runpodctl
    homepage: "https://github.com/runpod/runpodctl"
    description: "runpodctl is a CLI tool to manage your GPU pods on RunPod."
    repository:
      owner: runpod
      name: homebrew-runpodctl
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      branch: "runpodctl-{{ .Version }}"
      pull_request:
        enabled: true
        base:
          owner: runpod
          name: homebrew-runpodctl
          branch: main
    commit_author:
      name: runpod
      email: support@runpod.io
    install: |
      bin.install "runpodctl"
    ids: [default]

homebrew_casks:
  - name: runpodctl
    homepage: "https://github.com/runpod/runpodctl"
    description: "runpodctl is a CLI tool to manage your GPU pods on RunPod."
    repository:
      owner: runpod
      name: homebrew-runpodctl
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      branch: "runpodctl-cask-{{ .Version }}"
      pull_request:
        enabled: true
        base:
          owner: runpod
          name: homebrew-runpodctl
          branch: main
    commit_author:
      name: runpod
      email: support@runpod.io
    ids: [default]

checksum:
  name_template: "checksums_{{ .Version }}_sha256.txt"
  algorithm: sha256
